[package]
name = "rootkey-crypto"
version = "0.6.0"
edition = "2021"
# MSRV 1.89:dryoc 1.0 要求(其 sealed box 的 seal 路径会拒绝低阶点公钥)。
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitbeam-cn/rootkey-crypto"
description = "Cryptographic core of RootKey password manager — KDF / AEAD / key hierarchy / signing / sealed sharing. Open for audit."
keywords = ["cryptography", "password-manager", "argon2", "aead", "zeroize"]
categories = ["cryptography"]

[lib]
name = "crypto_core"
crate-type = ["rlib"]

[dependencies]
thiserror = "1"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

# KDF
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

# AEAD
# 密钥包裹用 AES-256-GCM-SIV(RFC 8452):nonce-misuse-resistant,适合长命包裹密钥。
# 条目数据仍用 XChaCha20-Poly1305(24B 随机 nonce)。
aes-gcm-siv = { version = "0.12", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

# RNG
getrandom = "0.2"

# Signing
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }

# 共享 vault sealed box —— 直接用 dryoc 的 libsodium crypto_box_seal,不自实现。
# 纯 Rust、与 C libsodium 兼容、按 libsodium 向量验证;内部用 curve25519-dalek 4.x
# (签名走 ed25519-dalek 3 = curve25519-dalek 5,树内共存两个 dalek 主版本)。
# 1.0 的 seal 会拒绝低阶点公钥,无需再手动 guard。
dryoc = "1.0"

# Constant-time comparisons (used transitively, pinned for clarity)
subtle = { version = "2.5", default-features = false }

# Encoding & helpers
data-encoding = "2.5"
unicode-normalization = "0.1"
blake3 = { version = "1.5", default-features = false }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
